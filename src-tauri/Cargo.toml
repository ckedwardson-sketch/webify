[package]
name = "webify"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "webify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
log = "0.4"

# Sync (see src/sync.rs) talks plain HTTP LAN-to-LAN and streams the db
# file straight to/from disk on both ends — no TLS backend needed, which
# keeps this dependency-light to cross-compile for Android.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Recipe link extraction (see src/recipe_extract.rs) — pulling the
# schema.org Recipe JSON-LD block out of a fetched page's HTML without
# pulling in a full HTML parser (html5ever/scraper are much heavier;
# see the opt-level note above about this machine's limited RAM).
regex = "1"

# Standalone sqlite connection for VACUUM INTO snapshotting/restoring the
# db file directly, independent of whatever the frontend's own plugin-sql
# connection is doing — needed on every platform, since both the desktop
# (server) and mobile (client upload) sides snapshot their own db.
rusqlite = { version = "0.31", features = ["bundled"] }

# Desktop-only local sync server (see src/sync.rs) — a tiny blocking HTTP
# server the phone talks to over the home LAN. tauri-plugin-dialog is here
# too: it's what backup.rs uses for the "choose a backup folder" native
# picker on desktop (Android goes through tauri-plugin-android-fs instead,
# below — the official dialog plugin doesn't implement a folder picker on
# Android).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tiny_http = "0.12"
tauri-plugin-dialog = "2"

# Android-only: lets backup.rs write into a user-picked folder. Android's
# scoped storage means a picked folder is only reachable via a content://
# URI (SAF), which plain std::fs can't touch — this crate wraps the
# Storage Access Framework calls needed to create/list/delete files there
# and to persist the access grant across app restarts. Pinned exactly
# (not "12", "=12.0.0") because this crate's method names have shifted
# between versions; if `cargo tauri android build` fails to compile
# src/backup.rs's android_backup module, check this pinned version's docs
# on docs.rs and adjust the method names in that module to match.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "=12.0.0"

# opt-level lowered from the default 3 to reduce peak memory usage during
# release compilation — this machine has only ~8GB RAM and rustc's codegen
# was OOM-crashing at the default optimization level.
[profile.release]
opt-level = 1
